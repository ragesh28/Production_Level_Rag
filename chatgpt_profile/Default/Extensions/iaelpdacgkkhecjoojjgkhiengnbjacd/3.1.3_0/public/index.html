<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MemoryPlugin</title>
    <link rel="stylesheet" href="build/bundle.css" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        width: 320px;
        padding: 16px;
        margin: 0;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px 0;
        text-align: center;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #666;
        margin: 0 0 16px 0;
        text-align: center;
      }
      .platforms {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .platform {
        background: #f0f0f0;
        border-radius: 16px;
        padding: 6px 12px;
        font-size: 12px;
      }
      .cta {
        background: #5e35b1;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        margin-top: 8px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="128x128.png" alt="MemoryPlugin Logo" class="logo" />
      <h1>MemoryPlugin</h1>
      <p>Long-Term Memory for your AI Chats</p>
      <p>Works with:</p>
      <div class="platforms">
        <div class="platform">ChatGPT</div>
        <div class="platform">Claude</div>
        <div class="platform">Gemini</div>
        <div class="platform">and more...</div>
      </div>
      <p>Make sure to visit your favorite AI chat platform and look for the MemoryPlugin button.</p>
      <a href="https://www.memoryplugin.com" target="_blank" class="cta">Visit Website</a>
    </div>
    <script src="build/src/content.js"></script>
  </body>
</html>
