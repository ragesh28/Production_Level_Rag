<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MemoryPlugin - Getting Started</title>
    <link rel="stylesheet" href="../src/tailwind.css" />
    <link rel="stylesheet" href="../src/onboarding.css" />
    <style>
      :root {
        /* Brand palette */
        --mp-purple: #5e35b1;
        --mp-purple-light: #7e57c2;

        /* Glassmorphism tokens */
        --mp-glass-bg: rgba(255, 255, 255, 0.7);
        --mp-glass-bg-strong: rgba(255, 255, 255, 0.85);
        --mp-glass-blur: 20px;
        --mp-glass-border: rgba(94, 53, 177, 0.15);

        /* Elevation shadows */
        --mp-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
        --mp-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.04);
        --mp-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08), 0 4px 8px rgba(0, 0, 0, 0.04);
        --mp-shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.1), 0 8px 16px rgba(0, 0, 0, 0.06);

        /* Easing curves */
        --mp-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --mp-ease: cubic-bezier(0.4, 0, 0.2, 1);
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div id="onboarding-root"></div>
    <script src="../src/onboarding.js"></script>
  </body>
</html>
