name: 🚀 Run NeuralRAG (Continuous)
on:
  workflow_dispatch:

# Need permissions to trigger other workflows
permissions:
  actions: write
  contents: write

jobs:
  run-neuralrag:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Max limit is 6 hours

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements_cloud.txt

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start App, Tunnel & Manage Lifecycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEYS: ${{ secrets.GOOGLE_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: |
          # 1. Start the web server
          python server.py &
          sleep 3
          
          # 2. Start Cloudflare Tunnel in background and capture URL
          cloudflared tunnel --url http://127.0.0.1:5000 > cloudflare.log 2>&1 &
          sleep 8
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflare.log)
          echo "========================================="
          echo "  NeuralRAG is LIVE!"
          echo "  Your Public URL is: $CF_URL"
          echo "========================================="
          
          # Update README.md and create index.html with the new URL
          if [ ! -z "$CF_URL" ]; then
            git pull
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            sed -i -E "s|https://[a-zA-Z0-9-]+\.(trycloudflare\.com\|ngrok-free\.app)|$CF_URL|g" README.md
            
            echo '<!DOCTYPE html>' > index.html
            echo '<html><head><meta charset="utf-8"><title>Connecting to NeuralRAG</title>' >> index.html
            echo '<meta http-equiv="refresh" content="0; url='$CF_URL'">' >> index.html
            echo '<script>window.location.replace("'$CF_URL'");</script>' >> index.html
            echo '<style>body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; text-align: center; } .box { padding: 2rem; background: #161b22; border-radius: 12px; border: 1px solid #30363d; } a { color: #58a6ff; text-decoration: none; } .spinner { border: 3px solid rgba(88, 166, 255, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #58a6ff; animation: spin 0.8s linear infinite; margin: 0 auto 1.5rem auto; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>' >> index.html
            echo '</head><body><div class="box"><div class="spinner"></div><h2>Connecting to NeuralRAG...</h2>' >> index.html
            echo '<p>Redirecting you to the active Cloudflare instance...</p>' >> index.html
            echo '<p>If not redirected, <a href="'$CF_URL'">click here</a>.</p>' >> index.html
            echo '</div></body></html>' >> index.html
            
            git add README.md index.html
            git commit -m "Update Live URL and GitHub Pages Redirect"
            git push
          fi
          
          # 3. Wait for 5 hours and 45 minutes (20700 seconds)
          echo "Sleeping for 5h 45m..."
          sleep 20700
          
          # 4. Trigger the next workflow to start
          echo "5h 45m reached. Triggering the next workflow run..."
          gh workflow run deploy.yml
          
          # 5. Wait 10 minutes for the new workflow to spin up
          echo "Sleeping for 10 minutes before terminating this run..."
          sleep 600
          
          # 6. Gracefully exit, cancelling this workflow
          echo "Time limit reached. Terminating current workflow."
          exit 0
