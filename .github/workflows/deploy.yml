name: 🚀 Run NeuralRAG (Continuous)
on:
  workflow_dispatch:

# Need permissions to trigger other workflows
permissions:
  actions: write
  contents: write

jobs:
  run-neuralrag:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Max limit is 6 hours

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements_cloud.txt

      - name: Install & Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          # Using user's requested model
          ollama pull qwen2.5:7b

      - name: Install Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

      - name: Start App, Tunnel & Manage Lifecycle
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 0. Start Ngrok with the secret token
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          
          # 1. Start the web server
          python server.py &
          sleep 3
          
          # 2. Start Ngrok Tunnel in background and capture URL
          ngrok http 5000 --log stdout > ngrok.log 2>&1 &
          sleep 8
          NGROK_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.ngrok-free\.app' ngrok.log | head -1)
          echo "========================================="
          echo "  NeuralRAG is LIVE!"
          echo "  Your Public URL is: $NGROK_URL"
          echo "========================================="
          
          # Update README.md with the new URL
          if [ ! -z "$NGROK_URL" ]; then
            git pull
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            # Replace any URL that matches ngrok-free.app OR trycloudflare.com
            sed -i -E "s|https://[a-zA-Z0-9-]+\.(trycloudflare\.com\|ngrok-free\.app)|$NGROK_URL|g" README.md
            git add README.md
            git commit -m "Update Live URL in README"
            git push
          fi
          
          # 3. Wait for 5 hours and 45 minutes (20700 seconds)
          echo "Sleeping for 5h 45m..."
          sleep 20700
          
          # 4. Trigger the next workflow to start
          echo "5h 45m reached. Triggering the next workflow run..."
          gh workflow run deploy.yml
          
          # 5. Wait 5 minutes for the new workflow to spin up
          echo "Sleeping for 5 minutes before terminating this run..."
          sleep 300
          
          # 6. Gracefully exit, cancelling this workflow
          echo "Time limit reached. Terminating current workflow."
          exit 0
